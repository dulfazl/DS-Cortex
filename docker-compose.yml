# One command for the whole app:  docker compose up --build
# Then open http://localhost:3000. Put GOOGLE_API_KEY in .env to enable Gemini (optional).
services:
  api:
    build:
      context: .
      args:
        # 0 leaves Chromium out (a much smaller image, but no PNG copies of the plots in the export)
        WITH_CHROMIUM: ${WITH_CHROMIUM:-1}
    env_file:
      - path: .env
        required: false
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      FAST_MODE: ${FAST_MODE:-0}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
    volumes:
      - cortex-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cortex-data:
