# Render Blueprint: New > Blueprint, pick this repository, enter GOOGLE_API_KEY when asked.
# Free instances have 512 MB of RAM, no persistent disk and sleep after 15 idle minutes: fine for the
# demo files and small CSVs. For larger files choose a bigger plan and add a disk at /data.
services:
  - type: web
    name: ds-cortex-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GOOGLE_API_KEY
        sync: false                       # entered in the Render dashboard, never committed
      - key: LLM_MODE
        value: auto
      - key: WITH_CHROMIUM                # build arg: leave Chromium out (smaller image, no PNG plot copies)
        value: "0"
      - key: STATIC_PLOTS
        value: "0"
      - key: FAST_MODE                    # 5-fold CV with 1 repeat and 8 tuning trials: fits a small instance
        value: "1"
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: DATA_RETENTION_HOURS
        value: "24"
      - key: ALLOWED_ORIGIN_REGEX
        value: https://ds-cortex-web(-[a-z0-9]+)?\.onrender\.com

  - type: web
    name: ds-cortex-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/ && cp -r public .next/standalone/
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_API_URL          # read at build time; change it if Render gives the API another URL
        value: https://ds-cortex-api.onrender.com
