# Render Blueprint for the API only: New > Blueprint, pick this repository, enter GOOGLE_API_KEY when asked.
# The website runs on Vercel (see README). One free service fits inside Render's 750 free hours a month;
# two always-on services do not.
# Free instances have 512 MB of RAM, no persistent disk and sleep after 15 idle minutes: fine for the
# demo files and small CSVs. For larger files choose a bigger plan and add a disk at /data.
services:
  - type: web
    name: ds-cortex-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GOOGLE_API_KEY
        sync: false                       # entered in the Render dashboard, never committed
      - key: LLM_MODE
        value: auto
      - key: WITH_CHROMIUM                # build arg: leave Chromium out (smaller image, no PNG plot copies)
        value: "0"
      - key: STATIC_PLOTS
        value: "0"
      - key: FAST_MODE                    # 5-fold CV with 1 repeat and 8 tuning trials: fits a small instance
        value: "1"
      - key: N_JOBS                       # one thread for models and BLAS: the free instance has a fraction of a CPU,
        value: "1"                        # and a thread per host core stalls the run (see app/__init__.py)
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MAX_ROWS                     # larger files are sampled down (logged in the ledger) to fit 512 MB
        value: "2000"                     # and a tenth of a CPU
      - key: CRITIC_TOP_K                 # the Critic reviews the best 2 candidates (default 3 in fast mode)
        value: "2"
      - key: CRITIC_ROUNDS                # one revision round instead of 3
        value: "1"
      - key: EXCLUDE_MODELS               # scikit-learn's gradient boosting costs ~13x XGBoost here; XGBoost and
        value: "gradient_boosting"        # LightGBM still cover gradient-boosted trees
      - key: DATA_RETENTION_HOURS
        value: "24"
      - key: ALLOWED_ORIGIN_REGEX
        value: https://(ds-cortex[a-z0-9-]*\.vercel\.app|ds-cortex-web(-[a-z0-9]+)?\.onrender\.com)
