name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: offline
      FAST_MODE: "1"
      CV_REPEATS: "1"
      STATIC_PLOTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: pip install -r requirements-dev.txt ruff pytest-cov
      - run: ruff check .
      - run: pytest -q --cov --cov-report=term-missing:skip-covered -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
        env:
          FAST_MODE: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx wait-on http://localhost:3000 http://localhost:8000/healthz
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
